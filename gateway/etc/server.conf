# Interface virtual de túnel (camada 3 – IP)
dev tun

# Endereço IP local onde o OpenVPN irá escutar
local 200.50.100.10

# Protocolo de transporte
proto udp

# Porta do serviço OpenVPN
port 1194

# Verificação de vida do túnel
keepalive 10 120

# Número máximo de clientes simultâneos
max-clients 5

# Certificado da Autoridade Certificadora (CA)
ca /etc/openvpn/server/ca.crt

# Certificado público do servidor
cert /etc/openvpn/server/vpn-server.crt

# Chave privada do servidor
key /etc/openvpn/server/vpn-server.key

# Parâmetros Diffie-Hellman (somente servidor)
dh /etc/openvpn/server/dh.pem

# Proteção adicional do handshake TLS
tls-auth /etc/openvpn/server/ta.key 0

# Obriga o cliente a apresentar certificado válido
remote-cert-tls client

# Lista de revogação de certificados
crl-verify /etc/openvpn/server/crl.pem

# Versão mínima do TLS
tls-version-min 1.2

# Cifra simétrica usada no túnel de dados
cipher AES-256-GCM

# Algoritmo de autenticação de pacotes
auth SHA256

# Executa o processo com usuário sem privilégios
user nobody
group nobody

# Modo servidor (cria automaticamente a rede VPN)
mode server

# Ativa comportamento TLS de servidor
tls-server

# Define a rede VPN e a máscara
server 10.0.0.0 255.255.255.0

# Diretório de configuração específica por cliente
client-config-dir /etc/openvpn/ccd

# Mantém chaves e túnel ativos após restart
persist-key
persist-tun

# Arquivo de status de conexões
status /var/log/openvpn/openvpn-status.log

# Arquivo de log
log-append /var/log/openvpn/server.log

# Nível de verbosidade do log
verb 3
